repos:
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: "v1.86.0"
  hooks:
    - id: terraform_fmt
      args:
      - --args=-recursive
      - --args=-no-color
- repo: local
  hooks:
    # always regenerate the root README, which includes examples/main.tf
    - id: terraform_docs
      name: Terraform docs
      entry: terraform-docs .
      language: system
      files: (\.tf|\.terraform-docs\.yml)$
      pass_filenames: false
    - id: terraform_test
      name: Terraform test
      entry: bash -c 'terraform init -backend=false -input=false -no-color >/dev/null && terraform test -no-color'
      language: system
      files: \.(tf|tftest\.hcl)$
      pass_filenames: false
