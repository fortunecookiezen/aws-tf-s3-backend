repos:
- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: "v1.86.0"
  hooks:
    - id: terraform_fmt
      args:
      - --args=-recursive
      - --args=-no-color
    - id: terraform_docs
- repo: local
  hooks:
    - id: terraform_test
      name: Terraform test
      entry: bash -c 'terraform init -backend=false -input=false -no-color >/dev/null && terraform test -no-color'
      language: system
      files: \.(tf|tftest\.hcl)$
      pass_filenames: false
