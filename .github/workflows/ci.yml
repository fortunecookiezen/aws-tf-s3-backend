name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.61.0
      - name: tflint
        run: |
          tflint --init
          tflint --format compact
      - name: README is up to date
        env:
          TERRAFORM_DOCS_VERSION: v0.24.0
        run: |
          curl -sSfL "https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin terraform-docs
          terraform-docs . --output-check

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest version allowed by required_version, and the latest release
        terraform: ["1.3.10", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the tests use mock_provider override_during, added in 1.11
        terraform: ["~1.11.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform test
